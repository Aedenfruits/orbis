input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;margin-top:4px}label{display:block;font-size:13px;font-weight:600;color:#3b4565}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#c5cce0}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{padding:6px 12px;font-size:13px}.btn.wide{width:100%}.btn.good{background:#e3f6ec;color:var(--good);border-color:#bfe8d3}.btn.bad{background:#fdeaf0;color:var(--crit);border-color:#f6c6d5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(29,43,83,.04)}.card.flush{padding:0;overflow:hidden}.card.soft{background:#f7f8fc;margin-top:12px}.scroll{overflow:auto}

function setupSwipe() {

async function savePlan(day, items) { await q(sb.from('work_plans').upsert({ employee_id: S.me.id, day, items, updated_at: new Date().toISOString() })); }
function planRow(it, ed, day) { const [t, c, ic] = WST[it.st || 'plan']; return `<div class="wp st-${it.st || 'plan'} ${it.urgent ? 'urg' : ''}"><div class="wpt"><b>${esc(it.from)}</b><small>${esc(it.to)}</small></div><div class="wpm"><div>${it.urgent ? '<span class="u">⚡ Urgent</span>' : ''}${esc(it.task)}</div>${it.note ? `<small>📝 ${esc(it.note)}</small>` : ''}${it.carry ? '<small>↪ carried from yesterday</small>' : ''}</div>
${ed ? `<select data-wst="${it.id}" data-d="${day}">${Object.entries(WST).map(([k, v]) => `<option value="${k}" ${(it.st || 'plan') === k ? 'selected' : ''}>${v[2]} ${v[0]}</option>`).join('')}</select><button class="btn sm" data-wdel="${it.id}" data-d="${day}">✕</button>` : `<span class="chip ${c}">${ic} ${t}</span>`}</div>`; }
const planSum = it => { const m = it.reduce((s, i) => s + Math.max(0, toMin(i.to) - toMin(i.from)), 0); return `<span class="small muted">${it.length} tasks · ${hmm(m)} · ✅ ${it.filter(x => x.st === 'done').length} · 🔄 ${it.filter(x => x.st === 'on').length} · ❌ ${it.filter(x => x.st === 'not').length}</span>`; };
const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };

const { ym, last, att, brk } = S.reg; const lines = [['Code', 'Name', 'Department', 'Date', 'In', 'Out', 'Break min', 'Worked', 'Offline']];

const csv = lines.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); const aEl = document.createElement('a'); aEl.href = url; aEl.download = `ORBIS-attendance-${ym}.csv`; aEl.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
});
VIEWS.employees = async () => {
const heads = await q(sb.from('dept_heads').select('*')); S.heads = heads;
const list = S.emps.filter(e => S.showLeft || e.active);
return `<div class="stack"><div class="row"><div><span class="eyebrow">Employee master</span><h2>Employees <span class="pink">${S.emps.filter(e => e.active).length}</span></h2></div><button class="btn pri" data-emp="new">+ Add employee</button></div>
<div class="card flush scroll"><table><thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Office</th><th>Reports to</th><th>Access</th><th>Login</th><th></th></tr></thead><tbody>
${list.map(e => `<tr class="${e.active ? '' : 'muted'}"><td>${esc(e.code)}</td><td><b>${esc(e.name)}</b><div class="small muted">${esc(e.desig)}</div></td><td>${esc(e.dept)}${heads.find(h => h.employee_id === e.id && h.dept === e.dept) ? ' <span class="chip">Head</span>' : ''}</td><td>${esc(e.office)}</td><td>${esc(empById(e.reports_to)?.name || '—')}</td><td>${e.access ? `<span class="chip good">${e.access.toUpperCase()}</span>` : 'Employee'}</td><td>${e.auth_uid ? '✓' : '<span class="chip warn">none</span>'}</td><td><button class="btn sm" data-emp="edit" data-id="${e.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>
<label class="chk"><input type="checkbox" id="showLeft" ${S.showLeft ? 'checked' : ''}> Show staff who left</label>
<div class="card"><h3>Department heads</h3><p class="small muted">Department heads see their department's attendance, leave and work plans. HR does not see work plans.</p><div class="grid2">${(C().depts || []).map(d => `<label>${esc(d)}<select data-dh="${esc(d)}"><option value="">— none —</option>${S.emps.filter(e => e.active).map(e => `<option value="${e.id}" ${heads.find(h => h.dept === d)?.employee_id === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></label>`).join('')}</div></div></div>`;
};
document.addEventListener('change', async e => {
if (e.target.id === 'showLeft') { S.showLeft = e.target.checked; render(); }
const d = e.target.closest('[data-dh]'); if (d) { try { if (d.value) await q(sb.from('dept_heads').upsert({ dept: d.dataset.dh, employee_id: d.value })); else await q(sb.from('dept_heads').delete().eq('dept', d.dataset.dh)); toast('Department head saved'); } catch (er) { toast(errMsg(er), true); } }
});
document.addEventListener('click', async e => {
const b = e.target.closest('[data-emp]'); if (!b) return; const a = b.dataset.emp, id = b.dataset.id;
if (a === 'new' || a === 'edit') {
const x = id ? empById(id) : { active: true, access: '' }; const opt = (arr, v) => arr.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('');
dlg(id ? 'Edit employee' : 'Add employee', `<div class="grid2"><label>Employee code<input id="e_code" value="${esc(x.code || '')}" ${id ? 'disabled' : ''} placeholder="ADN0072"></label><label>Full name<input id="e_name" value="${esc(x.name || '')}"></label>
<label>Designation<input id="e_desig" value="${esc(x.desig || '')}"></label><label>Department<select id="e_dept"><option></option>${opt(C().depts || [], x.dept)}</select></label>
<label>Office<select id="e_office"><option></option>${opt(C().offices || [], x.office)}</select></label><label>Joining date<input type="date" id="e_join" value="${x.join_date || ''}"></label>
<label>Reports to<select id="e_mgr"><option value="">— nobody —</option>${S.emps.filter(o => o.id !== id && o.active).map(o => `<option value="${o.id}" ${x.reports_to === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></label>
<label>Access level<select id="e_acc"><option value="" ${!x.access ? 'selected' : ''}>Employee — own data (+ team if manager)</option><option value="hr" ${x.access === 'hr' ? 'selected' : ''}>HR — all employees</option><option value="md" ${x.access === 'md' ? 'selected' : ''}>MD / Director — all employees</option></select></label></div>
${id ? `<label class="chk"><input type="checkbox" id="e_active" ${x.active ? 'checked' : ''}> Active (untick when the person leaves)</label>` : ''}
<div class="card soft"><b>${id ? (x.auth_uid ? 'Reset password' : 'Create login') : 'Login password'}</b><p class="small muted">They sign in with their employee code and this password.${id && x.auth_uid ? ' Leave empty to keep the current password.' : ''}</p><input id="e_pw" type="text" placeholder="at least 8 characters" autocomplete="off"></div>`,
`<button class="btn pri" data-emp="save" data-id="${id || ''}">Save</button>`);
}
if (a === 'save') {
const v = k => $('#' + k)?.value?.trim() ?? ''; const pw = $('#e_pw').value;
const row = { name: v('e_name'), desig: v('e_desig'), dept: v('e_dept'), office: v('e_office'), join_date: v('e_join') || null, reports_to: v('e_mgr') || null, access: v('e_acc') };
if (!row.name) return toast('Enter the name', true);
if (id && $('#e_active')) row.active = $('#e_active').checked;
if (id && id === S.me.id && row.access !== S.me.access && !confirm('You are changing your own access level. Continue?')) return;
b.disabled = true;
try {
let emp = id ? empById(id) : null;
if (!id) { const code = v('e_code').toUpperCase(); if (!code) throw new Error('Enter the employee code'); if (S.emps.some(e => e.code === code)) throw new Error('That employee code already exists');
row.code = code; emp = (await q(sb.from('employees').insert(row).select().single())); }
else await q(sb.from('employees').update(row).eq('id', id));
if (pw) { if (pw.length < 8) throw new Error('Password must be at least 8 characters');
if (emp.auth_uid) await rpc('hr_set_password', { p_emp: emp.id, p_password: pw });
else { const tmp = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'orbis.tmp' } });
const { data, error } = await tmp.auth.signUp({ email: codeToEmail(emp.code), password: pw }); if (error) throw error;
await q(sb.from('employees').update({ auth_uid: data.user.id }).eq('id', emp.id)); } }
closeDlg(); toast('Employee saved'); await loadCore(); render();
} catch (er) { toast(errMsg(er), true); } finally { b.disabled = false; }
}
});
VIEWS.setup = async () => {
const [devs, ip] = await Promise.all([q(sb.from('devices').select('*').order('created_at')), rpc('my_ip').catch(() => '')]);
const ips = C().officeIps || []; const here = S.device;
return `<div class="stack narrow"><div><span class="eyebrow">HR setup</span><h2>Computers & settings</h2></div>
<div class="card"><h3>This computer</h3>${here ? `<p><span class="chip good">✓ Registered</span> ${esc(here.name)} · ${esc(here.office)} · ${here.kind === 'kiosk' ? 'Common PC (shared)' : 'Own computer'}</p><button class="btn sm" id="devForget">Remove from this computer</button>`
: `<p class="small muted">Register each office laptop/desktop once. Only registered computers can punch.</p><div class="grid3"><label>Computer name<input id="d_name" placeholder="e.g. Accounts PC 1"></label><label>Office<select id="d_office">${(C().offices || []).map(o => `<option>${esc(o)}</option>`).join('')}</select></label><label>Type<select id="d_kind"><option value="own">Own computer (one person)</option><option value="kiosk">Common PC (shared)</option></select></label></div><button class="btn pri" id="devReg">Register this computer</button>`}</div>
<div class="card"><h3>Registered computers (${devs.length})</h3>${devs.map(d => `<div class="li"><div><b>${esc(d.name)}</b><small>${esc(d.office)} · ${d.kind === 'kiosk' ? 'Common PC' : 'Own computer'} · added ${fmtD(ymd(d.created_at))}</small></div><button class="btn sm" data-devoff="${d.id}" data-on="${d.active ? 0 : 1}">${d.active ? 'Disable' : 'Enable'}</button></div>`).join('') || '<p class="muted small">None yet</p>'}</div>
<div class="card"><h3>Office internet</h3><p class="small muted">When addresses are added, punching works only from these internet connections. Leave empty to allow any network (registered computers only).</p>
<p>This connection: <b>${esc(ip || 'unknown')}</b> ${ip && !ips.includes(ip) ? '<button class="btn sm pri" id="ipAdd">+ Add as office network</button>' : ips.includes(ip) ? '<span class="chip good">office network</span>' : ''}</p>
${ips.map(x => `<div class="li"><span>${esc(x)}</span><button class="btn sm" data-iprm="${esc(x)}">Remove</button></div>`).join('')}</div>
<div class="card"><h3>Rules</h3><div class="grid3"><label>Shift start<input type="time" id="c_ss" value="${esc(C().shiftStart || '09:00')}"></label><label>Shift end<input type="time" id="c_se" value="${esc(C().shiftEnd || '18:00')}"></label><label>Grace (min)<input type="number" id="c_gr" value="${C().graceMin ?? 10}"></label>
${brCfg().map((b, i) => `<label>${esc(b.name)} break (min)<input type="number" id="c_b${i}" value="${b.min}"></label>`).join('')}<label>Extra break per month (min)<input type="number" id="c_x" value="${C().extraMonthlyMin ?? 30}"></label></div>
<h4>Leave per year</h4><div class="grid3">${ltypes().map((t, i) => `<label>${esc(t.name)}<input type="number" id="c_l${i}" value="${t.days}"></label>`).join('')}</div>
<div class="grid2"><label>Departments (one per line)<textarea id="c_depts" rows="5">${esc((C().depts || []).join('\n'))}</textarea></label><label>Offices (one per line)<textarea id="c_offs" rows="5">${esc((C().offices || []).join('\n'))}</textarea></label></div>
<button class="btn pri" id="cfgSave">Save rules</button></div></div>`;
};
async function saveSettings(patch) { const data = { ...C(), ...patch }; await q(sb.from('app_settings').update({ data }).eq('id', 1)); S.settings = data; }
document.addEventListener('click', async e => {
const b = e.target.closest('button'); if (!b || S.view !== 'setup') return;
try {
if (b.id === 'devReg') { const name = $('#d_name').value.trim(); if (!name) return toast('Give this computer a name', true); const tok = await rpc('register_device', { p_name: name, p_office: $('#d_office').value, p_kind: $('#d_kind').value }); lsSet('device', tok); await loadCore(); toast('✓ This computer can now be used for punching'); render(); }
if (b.id === 'devForget') { if (!confirm('Remove the punch registration from this computer?')) return; localStorage.removeItem('orbis.device'); S.device = null; render(); }
if (b.dataset.devoff) { await q(sb.from('devices').update({ active: b.dataset.on === '1' }).eq('id', b.dataset.devoff)); render(); }
if (b.id === 'ipAdd') { const ip = await rpc('my_ip'); await saveSettings({ officeIps: [...new Set([...(C().officeIps || []), ip])] }); toast('Office network added'); render(); }
if (b.dataset.iprm) { await saveSettings({ officeIps: (C().officeIps || []).filter(x => x !== b.dataset.iprm) }); render(); }
if (b.id === 'cfgSave') { const lines = id => $('#' + id).value.split('\n').map(x => x.trim()).filter(Boolean);
await saveSettings({ shiftStart: $('#c_ss').value, shiftEnd: $('#c_se').value, graceMin: Number($('#c_gr').value) || 0, extraMonthlyMin: Number($('#c_x').value) || 0,
breaks: brCfg().map((x, i) => ({ ...x, min: Number($('#c_b' + i).value) || x.min })), leaveTypes: ltypes().map((t, i) => ({ ...t, days: Number($('#c_l' + i).value) || 0 })), depts: lines('c_depts'), offices: lines('c_offs') }); toast('Rules saved'); render(); }
} catch (er) { toast(errMsg(er), true); }
});
boot();
</script></body></html>
