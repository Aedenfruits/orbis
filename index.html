const rest = [];

else if (it.k === 'bend') await rpc('break_end', { p_token: it.tok, p_at: it.at });

async function loadCore() {
const uid = S.session.user.id;
const [emps, set] = await Promise.all([
q(sb.from('employees').select('*').order('name')),
q(sb.from('app_settings').select('data').eq('id', 1).maybeSingle())
]);
S.emps = emps || []; S.settings = set?.data || {};
S.me = S.emps.find(e => e.auth_uid === uid) || null;
if (S.me) { try { S.team = (await rpc('my_team')) || []; } catch { S.team = []; } S.team = S.team.filter(id => id && id !== S.me.id); }

S.device = null;
if (tok) { try { const d = await rpc('device_info', { p_token: tok }); if (d) S.device = { ...d, token: tok }; } catch { } }
}
async function loadToday() {
if (!S.me) return;
const t = todayStr();
const [a, b] = await Promise.all([
q(sb.from('attendance').select('*').eq('employee_id', S.me.id).eq('day', t).maybeSingle()),
q(sb.from('breaks').select('*').eq('employee_id', S.me.id).eq('day', t).order('start_at'))
]);
S.today = a; S.breaks = b || [];
// apply queued offline actions so the screen reflects them
for (const it of queue()) {
if (it.k === 'punch') { if (!S.today) S.today = { in_at: it.at, offline: true }; else if (!S.today.out_at) S.today = { ...S.today, out_at: it.at, offline: true }; }
if (it.k === 'bstart') S.breaks.push({ kind: it.kind, start_at: it.at, end_at: null, offline: true });
if (it.k === 'bend') { const ob = S.breaks.find(x => !x.end_at); if (ob) ob.end_at = it.at; }
}
}

return `<div class="stack"><div class="row"><div><span class="eyebrow">🔓 Vault unlocked · AES-256</span><h2>Employee documents</h2></div>
<div class="row" style="gap:8px"><button class="btn sm" data-doc="chpw">Change vault password</button><button class="btn sm" data-doc="lock">🔒 Lock now</button></div></div>
<div class="card"><label>Employee<select id="docEmp">${emps.map(e => `<option value="${e.id}" ${e.id === S.docEmp ? 'selected' : ''}>${esc(e.code)} · ${esc(e.name)} — ${cnt(e.id)}/${DOC_KINDS.length - 1} types</option>`).join('')}</select></label>
<div class="small muted" style="margin-top:6px">${done.size} of ${DOC_KINDS.length} document types on file · ${docs.length} files · ${fmtSize(docs.reduce((s, d) => s + d.size, 0))}</div></div>
<input type="file" id="docFile" multiple accept="image/*,application/pdf,.doc,.docx" style="display:none">
<div class="stack" style="gap:8px">${DOC_KINDS.map(([k, n, i, tip]) => { const ds = docs.filter(d => d.kind === k);
return `<div class="card docrow ${ds.length ? '' : 'miss'}"><span class="pi">${i}</span><div class="grow"><b>${n}</b>${tip ? `<div class="small muted">${tip}</div>` : ''}
${ds.map(d => `<div class="docf"><span class="grow">📄 ${esc(d._m.name)} <span class="small muted">· ${fmtSize(d.size)} · ${fmtD(ymd(d.uploaded_at))}</span></span>
<button class="btn sm" data-doc="view" data-id="${d.id}">View</button><button class="btn sm" data-doc="dl" data-id="${d.id}">Download</button><button class="btn sm" data-doc="del" data-id="${d.id}">Delete</button></div>`).join('')}</div>
${ds.length ? '<span class="chip good">✓</span>' : '<span class="chip warn">Missing</span>'}<button class="btn sm pri" data-doc="up" data-kind="${k}">+ Upload</button></div>`; }).join('')}</div>
<p class="small muted">Files are encrypted on this computer before upload. Photos are shrunk automatically. Max 10 MB per file.</p></div>`;
};
document.addEventListener('submit', async e => {
if (e.target.id !== 'vUnlockF') return; e.preventDefault(); const b = e.submitter; b.disabled = true; b.textContent = 'Unlocking…';
try { const raw = await vaultOpenRaw($('#v_pw').value, false); S.dek = await importDek(raw); raw.fill(0); toast('🔓 Vault unlocked'); render(); }
catch (er) { toast(errMsg(er), true); b.disabled = false; b.textContent = 'Unlock'; }
});
document.addEventListener('change', async e => {
if (e.target.id === 'docEmp') { S.docEmp = e.target.value; render(); }
if (e.target.id === 'docFile') {
const files = [...e.target.files], kind = e.target.dataset.kind; e.target.value = ''; if (!files.length || !S.dek) return;
vaultTouch(); let ok = 0;
for (const f of files) { toast(`Encrypting & uploading ${f.name}…`); try { await docUpload(S.docEmp, kind, f); ok++; } catch (er) { toast(errMsg(er), true); } }
if (ok) { toast(`🔒 ${ok} file${ok > 1 ? 's' : ''} encrypted and saved`); render(); }
}
});
document.addEventListener('click', async e => {
const b = e.target.closest('[data-doc]'); if (!b) return; e.preventDefault(); const a = b.dataset.doc, d = (S.docList || []).find(x => x.id === b.dataset.id);
try {
if (a === 'create') {
const p1 = $('#v_p1').value, p2 = $('#v_p2').value;
if (p1.length < 10) return toast('Use at least 10 characters', true); if (p1 !== p2) return toast('The two passwords do not match', true);
b.disabled = true; b.textContent = 'Creating…'; const rec = await vaultCreate(p1); S.lastRec = rec;
dlg('Save your recovery key', `<p>This key can reset the vault password. <b>It is shown only once.</b> Print it or save the file, and keep it in the office safe or with the MD.</p><div class="reckey">${rec}</div>
<p class="msg bad">Without the vault password and this key, the documents can never be opened again.</p><label class="chk"><input type="checkbox" id="recOk"> I have printed or saved the recovery key</label>`,
`<button class="btn" data-doc="recfile">⬇ Save as file</button><button class="btn" data-doc="recprint">🖨 Print</button><button class="btn pri" data-doc="recdone">Done</button>`);
$('#dlg').oncancel = ev => { if (!$('#recOk')?.checked) ev.preventDefault(); };
}
if (a === 'recfile') recoveryFile(S.lastRec);
if (a === 'recprint') { const w = open('', '_blank', 'width=600,height=400'); if (w) { w.document.write(`<pre style="font:16px monospace;padding:30px">ORBIS · Document Vault RECOVERY KEY\nAeden Fruits International Pvt Ltd\n${new Date().toLocaleString('en-IN', { timeZone: TZ })}\n\n<b style="font-size:22px">${S.lastRec}</b>\n\nKeep in the office safe.</pre>`); w.document.close(); w.print(); } }
if (a === 'recdone') { if (!$('#recOk').checked) return toast('Please tick the box after saving the key', true); S.lastRec = null; $('#dlg').oncancel = null; closeDlg(); toast('🔓 Vault ready'); render(); }
if (a === 'recshow') { const x = $('#recBox'); x.style.display = x.style.display === 'none' ? '' : 'none'; }
if (a === 'recover') {
const p1 = $('#v_np1').value; if (p1.length < 10) return toast('Use at least 10 characters', true); if (p1 !== $('#v_np2').value) return toast('The two passwords do not match', true);
b.disabled = true; const raw = await vaultOpenRaw($('#v_rec').value, true); await vaultSetPw(raw, p1); S.dek = await importDek(raw); raw.fill(0); toast('✓ New vault password set'); render();
}
if (a === 'lock') vaultLock('🔒 Vault locked');
if (a === 'chpw') dlg('Change vault password', `<label>Current vault password<input id="cv_o" type="password"></label><label>New vault password (at least 10 characters)<input id="cv_1" type="password"></label><label>Type it again<input id="cv_2" type="password"></label><p class="small muted">Documents stay the same; only the password that unlocks them changes. The recovery key keeps working.</p>`, `<button class="btn pri" data-doc="chpwsave">Save</button>`);
if (a === 'chpwsave') { const p1 = $('#cv_1').value; if (p1.length < 10) return toast('Use at least 10 characters', true); if (p1 !== $('#cv_2').value) return toast('The two passwords do not match', true);
const raw = await vaultOpenRaw($('#cv_o').value, false); await vaultSetPw(raw, p1); raw.fill(0); closeDlg(); toast('✓ Vault password changed'); }
if (!S.dek && ['up', 'view', 'dl', 'del', 'delok'].includes(a)) return render();
if (a === 'up') { const f = $('#docFile'); f.dataset.kind = b.dataset.kind; f.click(); }
if (a === 'view' || a === 'dl') { vaultTouch(); b.disabled = true; const o = await docOpen(d); b.disabled = false;
if (a === 'dl') return saveBlob(o.blob, o.name);
const u = URL.createObjectURL(o.blob), img = o.mime.startsWith('image/'), pdf = o.mime === 'application/pdf';
dlg(esc(o.name), img ? `<img class="docview" src="${u}" alt="">` : pdf ? `<iframe class="docview pdf" src="${u}"></iframe>` : '<p>This file type cannot be previewed. Use Download.</p>', `<button class="btn" data-doc="dl" data-id="${d.id}">⬇ Download</button>`);
$('#dlg').classList.add('wide'); $('#dlg').addEventListener('close', () => { $('#dlg').classList.remove('wide'); URL.revokeObjectURL(u); }, { once: true }); }
if (a === 'del') dlg('Delete document?', `<p>Delete <b>${esc(d._m.name)}</b> (${esc(DOC_KINDS.find(k => k[0] === d.kind)?.[1] || d.kind)}) for ${esc(empById(d.employee_id)?.name || '')}? This cannot be undone.</p>`, `<button class="btn pri" data-doc="delok" data-id="${d.id}">Delete</button>`);
if (a === 'delok') { await sb.storage.from(DOC_BUCKET).remove([d.path]); await q(sb.from('emp_docs').delete().eq('id', d.id)); closeDlg(); toast('Deleted'); render(); }
} catch (er) { toast(errMsg(er), true); b.disabled = false; if (a === 'create') b.textContent = 'Create the vault'; }
});
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; S.canInstall = true; document.querySelectorAll('.inst').forEach(b => b.hidden = false); });
addEventListener('appinstalled', () => { installEvt = null; S.canInstall = false; document.querySelectorAll('.inst').forEach(b => b.hidden = true); toast('✓ ORBIS app installed — find it on your desktop / Start menu'); });
document.addEventListener('click', async e => {
const b = e.target.closest('.inst'); if (!b) return;
if (!installEvt) return toast('Use the browser menu → "Install ORBIS" (or "Add to Home screen" on phones)');
installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') { installEvt = null; S.canInstall = false; document.querySelectorAll('.inst').forEach(x => x.hidden = true); }
});
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { }));
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const streakBadge = s => s >= 20 ? `<span class="chip lbst gold">🏆 ${s}-day streak</span>` : s >= 10 ? `<span class="chip lbst">🔥 ${s} days on time</span>` : s >= 5 ? `<span class="chip lbst">⚡ ${s} days on time</span>` : '';
VIEWS.board = async () => {
const mo = S.lbMonth || todayStr().slice(0, 7), cur = todayStr().slice(0, 7);
const d = await rpc('leaderboard', { p_month: mo + '-01' }); const top = d.top || [], me = d.me;
const [y, m] = mo.split('-').map(Number), label = new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
const MED = ['🥇', '🥈', '🥉'];
const podCard = (p, i, cls) => !p ? `<div class="pod ${cls} empty"><div class="bar"></div></div>` : `<div class="pod ${cls} ${p.me ? 'me' : ''}" style="--d:${i}">
<div class="av">${esc(initials(p.name))}${p.rank === 1 ? '<span class="crown">👑</span>' : ''}</div>
<b>${esc(p.name)}${p.me ? ' <small>(you)</small>' : ''}</b><small>${esc(p.dept || '')}</small>
<div class="bar"><span class="md">${MED[p.rank - 1] || '🏅'}</span><span class="pc">${p.pct}%</span><small>${p.ontime}/${p.days} on time</small></div>${streakBadge(p.streak)}</div>`;
return `<div class="stack narrow"><div class="row"><div><span class="eyebrow">Attendance champions</span><h2>🏆 Leaderboard</h2></div>
<div class="row" style="gap:6px"><button class="btn sm" data-lbm="-1">‹</button><b class="lbmon">${label}</b><button class="btn sm" data-lbm="1" ${mo >= cur ? 'disabled' : ''}>›</button></div></div>
${top.length ? `<div class="card podium">${podCard(top[1], 1, 'p2')}${podCard(top[0], 0, 'p1')}${podCard(top[2], 2, 'p3')}</div>
${top.slice(3).map((p, i) => `<div class="card lbrow ${p.me ? 'me' : ''}" style="--d:${i + 3}"><span class="rk">#${p.rank}</span><div class="av sm">${esc(initials(p.name))}</div><div class="grow"><b>${esc(p.name)}${p.me ? ' <small>(you)</small>' : ''}</b><div class="small muted">${esc(p.dept || '')} · ${p.ontime}/${p.days} on time</div></div>${streakBadge(p.streak)}<span class="pc">${p.pct}%</span></div>`).join('')}`
: `<div class="card center muted">No attendance recorded for ${label} yet.</div>`}
<div class="card mecard">${me ? `<div class="row"><div><span class="eyebrow">Your position</span><h3 style="margin:2px 0">#${me.rank} <small class="muted">of ${d.total}</small></h3></div><div class="pc big">${me.pct}%</div></div>
<div class="grid3 small"><div>⏰ On time<br><b>${me.ontime}/${me.days} days</b></div><div>✅ Proper check-out<br><b>${me.complete}/${me.days} days</b></div><div>☕ Breaks within limit<br><b>${me.brk_ok}/${me.days} days</b></div></div>
${me.streak ? `<p class="small">Current on-time streak: <b>${me.streak} day${me.streak > 1 ? 's' : ''}</b> ${me.streak >= 5 ? '🔥' : ''}</p>` : ''}`
: `<p class="muted" style="margin:0">You have no attendance in ${label} yet. Check in on time to get on the board!</p>`}</div>
<p class="small muted">How points work, for each working day: <b>+3</b> checked in on time (by ${esc(addMinHM(C().shiftStart || '09:00', C().graceMin || 0))}), <b>+2</b> checked out properly, <b>+1</b> breaks within the daily allowance. Only the top 5 are shown to everyone.</p></div>`;
};
document.addEventListener('click', e => {
const b = e.target.closest('[data-lbm]'); if (!b) return; const [y, m] = (S.lbMonth || todayStr().slice(0, 7)).split('-').map(Number);
const d = new Date(y, m - 1 + Number(b.dataset.lbm), 1); const v = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; if (v > todayStr().slice(0, 7)) return; S.lbMonth = v; render();

boot();
