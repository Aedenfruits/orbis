const S = { session: null, me: null, emps: [], settings: {}, team: [], view: 'punch', device: null, today: null, breaks: [], busy: false };
const isAdmin = () => ['hr', 'md'].includes(S.me?.access);
const empById = id => S.emps.find(e => e.id === id);
const C = () => S.settings || {};
const queueAll = () => lsGet('queue', []);
const queue = () => queueAll().filter(it => !S.me || !it.emp || it.emp === S.me.id);
function enqueue(item) { const qq = queueAll(); qq.push({ ...item, emp: S.me?.id }); lsSet('queue', qq); }
async function flushQueue() {
const qq = queue(); if (!qq.length || !navigator.onLine || !S.me) return;
const rest = [];
for (const it of qq) {
try {
if (it.k === 'punch') await rpc('punch', { p_token: it.tok, p_at: it.at });
else if (it.k === 'bstart') await rpc('break_start', { p_token: it.tok, p_kind: it.kind, p_at: it.at });
else if (it.k === 'bend') await rpc('break_end', { p_token: it.tok, p_at: it.at });
} catch (e) { if (isNetErr(e)) rest.push(it); else toast('Offline entry rejected: ' + errMsg(e), true); }
}
lsSet('queue', [...queueAll().filter(it => it.emp && it.emp !== S.me.id), ...rest]);
if (rest.length < qq.length) { toast('✓ Offline punches synced'); await loadToday(); render(); }
}
const isNetErr = e => !navigator.onLine || (!e?.code && /Failed to fetch|NetworkError|Load failed|fetch failed|Network request failed/i.test(errMsg(e)));
addEventListener('online', flushQueue); setInterval(flushQueue, 30000);
async function loadCore() {
const uid = S.session.user.id;
const [emps, set] = await Promise.all([
q(sb.from('employees').select('*').order('name')),
q(sb.from('app_settings').select('data').eq('id', 1).maybeSingle())
]);
S.emps = emps || []; S.settings = set?.data || {};
S.me = S.emps.find(e => e.auth_uid === uid) || null;
if (S.me) { try { S.team = (await rpc('my_team')) || []; } catch { S.team = []; } S.team = S.team.filter(id => id && id !== S.me.id); }
await loadHolidays();
const tok = lsGet('device', null);
S.device = null;
if (tok) { try { const d = await rpc('device_info', { p_token: tok }); if (d) S.device = { ...d, token: tok }; } catch { } }
}
async function loadToday() {
if (!S.me) return;
const t = todayStr();
const [a, b] = await Promise.all([
q(sb.from('attendance').select('*').eq('employee_id', S.me.id).eq('day', t).maybeSingle()),
q(sb.from('breaks').select('*').eq('employee_id', S.me.id).eq('day', t).order('start_at'))
]);
S.today = a; S.breaks = b || [];
// apply queued offline actions so the screen reflects them
for (const it of queue()) {
if (it.k === 'punch') { if (!S.today) S.today = { in_at: it.at, offline: true }; else if (!S.today.out_at) S.today = { ...S.today, out_at: it.at, offline: true }; }
if (it.k === 'bstart') S.breaks.push({ kind: it.kind, start_at: it.at, end_at: null, offline: true });
if (it.k === 'bend') { const ob = S.breaks.find(x => !x.end_at); if (ob) ob.end_at = it.at; }
}
}

const left = Math.max(250, 1750 - (performance.now() - (window.__introT || 0)));

function noDevMsg() { return onMobile() ? '📱 Check in and check out work on office computers, not on phones.' : isAdmin() ? 'This computer isn\'t registered for punching. Register it in Computers & settings.' : 'This computer isn\'t registered for punching. Ask HR to register it, or use your own office computer.'; }
async function boot() {
const { data } = await sb.auth.getSession(); S.session = data.session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; });
if (!S.session) { await INTRO; return renderLogin(); }
try { await loadCore(); } catch (e) { return renderFatal(e); }
if (!S.me) {
let need = false; try { need = await rpc('needs_setup'); } catch { }
if (need) return renderSetup();
return renderFatal(new Error('Your login is not linked to an employee. Ask HR.'));
}
await INTRO;
if (S.me.must_change_pw) await forcePw();
const today = loadToday().catch(() => { });
if (!S.splashed) { S.splashed = true; await splash(); }
await today;
route(); flushQueue(); autoBackup(); startReminders(); refreshBadges();
}

async function prepFile(f) {

try {

c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
if (b && b.size < f.size) return { bytes: new Uint8Array(await b.arrayBuffer()), mime: 'image/jpeg', name: f.name.replace(/\.\w+$/, '') + '.jpg' };
} catch { }
}
return { bytes: new Uint8Array(await f.arrayBuffer()), mime: f.type || 'application/octet-stream', name: f.name };
}

async function cropToJpeg(src, w = 480, h = 600) {   // centre-crop to 4:5 portrait
const img = src instanceof HTMLVideoElement ? src : await createImageBitmap(src);
const iw = img.videoWidth || img.width, ih = img.videoHeight || img.height, r = w / h;
let sw = iw, sh = iw / r; if (sh > ih) { sh = ih; sw = ih * r; }
const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
if (src instanceof HTMLVideoElement) { x.translate(w, 0); x.scale(-1, 1); }   // mirror like a selfie
x.drawImage(img, (iw - sw) / 2, (ih - sh) / 2.6, sw, sh, 0, 0, w, h);
return new Promise(res => c.toBlob(res, 'image/jpeg', 0.86));
}
