else if (it.k === 'bstart') await rpc('break_start', { p_token: it.tok, p_kind: it.kind, p_at: it.at });

lsSet('queue', [...queueAll().filter(it => it.emp && it.emp !== S.me.id), ...rest]);

async function loadToday() {
if (!S.me) return;
const t = todayStr();

q(sb.from('attendance').select('*').eq('employee_id', S.me.id).eq('day', t).maybeSingle()),
q(sb.from('breaks').select('*').eq('employee_id', S.me.id).eq('day', t).order('start_at'))
]);
S.today = a; S.breaks = b || [];
// apply queued offline actions so the screen reflects them
for (const it of queue()) {

if (it.k === 'bstart') S.breaks.push({ kind: it.kind, start_at: it.at, end_at: null, offline: true });

function payCalc(ctc, row, ex = {}) {

const gross = Math.round(ctc * days / cal), basic = Math.round(gross * P.basicPct / 100), hra = Math.round(basic * P.hraPct / 100), spec = gross - basic - hra;
const bonus = Math.round(Number(ex.bonus) || 0), adv = Math.round(Number(ex.adv) || 0), tds = Math.round(Number(ex.tds) || 0);
const pf = P.pf ? Math.round(Math.min(basic, P.pfCap) * 0.12) : 0;
const esi = P.esi && ctc <= P.esiLimit ? Math.ceil((gross + bonus) * 0.0075) : 0;
const pt = days > 0 ? Math.round(Number(P.pt) || 0) : 0;
const earn = [['Basic', basic], ['House rent allowance', hra], ['Special allowance', spec]]; if (bonus) earn.push(['Bonus / incentive', bonus]);
